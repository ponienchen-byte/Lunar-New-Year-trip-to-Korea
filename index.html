    // =========================================================================
    // 2. 狀態管理與內嵌／暫存實景照初始化

    const state = {
      activeTab: 'home',              // 'home' 或 'tour1'..'tour6'
      homeFilter: 'all',              // 'all' | 'yingchun' | 'hesui' | 'taoyuan' | 'kaohsiung' | 'confirmed'
      clientOnlyLocked: false,        // 若為客戶純淨匯出檔則鎖死 true
      isClientMode: false,            // 👁️ 客戶展示模式開關
      photos: {},                     // key: `${tourId}_${slot}` -> compressed JPEG DataURL
      selectedDateIdx: {},            // 記錄各團目前點選的出發日期索引（連動第7區 LINE 報價）
      pendingUploadKey: null,         // 點選換圖時暫存目標插槽 key

      managerFilterTour: 'all'        // 批次照片管理器的分團篩選
    };

    TOURS.forEach(t => {
      state.selectedDateIdx[t.id] = t.defaultDateIdx || 0;
    });

    /**
     * 載入實景照片：優先載入 window.EMBEDDED_PHOTOS，非鎖定純淨版再合併 localStorage
     */
    function loadPhotosAndConfig() {
      const exportCfg = (window.EXPORT_CONFIG && typeof window.EXPORT_CONFIG === 'object')
        ? window.EXPORT_CONFIG
        : { clientOnly: false };

      state.clientOnlyLocked = Boolean(exportCfg.clientOnly);
      state.isClientMode = state.clientOnlyLocked;

      const embedded = (window.EMBEDDED_PHOTOS && typeof window.EMBEDDED_PHOTOS === 'object')
        ? window.EMBEDDED_PHOTOS
        : {};

      const merged = Object.assign({}, embedded);

      // 若不是客戶純淨鎖定版，合併本機瀏覽器 localStorage 中的最新修改
      if (!state.clientOnlyLocked) {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && typeof parsed === 'object') {
              Object.assign(merged, parsed);
            }
          }
        } catch (err) {
          console.warn('讀取 localStorage 失敗:', err);
        }
      }
      state.photos = merged;
    }

    /**
     * 將目前實景照片安全寫入 localStorage（具備防滿載 try/catch 提醒）
     */
    function persistPhotosToStorage() {
      if (state.clientOnlyLocked) return true;
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.photos));
        return true;
      } catch (err) {
        console.error('localStorage 容量不足:', err);
        showToast('⚠️ 瀏覽器暫存空間已接近上限！照片已保留在目前畫面，建議立刻點「💾 匯出成品網頁」永久保存！', '!');
        return false;
      }
    }

    /**
     * 取得指定插槽的實景照（封面若未單獨上傳，自動借用該團第一張已上傳的景點實景照）
     */
    function getSlotPhoto(tourId, slot, allowCoverFallback = false) {
      const directKey = `${tourId}_${slot}`;
      if (state.photos[directKey]) {
        return { src: state.photos[directKey], isBorrowed: false, key: directKey };
      }
      if (allowCoverFallback && slot === 'cover') {
        for (const hSlot of ['h0', 'h1', 'h2', 'h3']) {
          const hKey = `${tourId}_${hSlot}`;
          if (state.photos[hKey]) {
            return { src: state.photos[hKey], isBorrowed: true, key: directKey };
          }
        }
      }
      return { src: null, isBorrowed: false, key: directKey };
    }

    /**
     * 計算目前實際已上傳的插槽總數（最多 30）
     */
    function getUploadedCount() {
      let count = 0;
      TOURS.forEach(t => {
        ['cover', 'h0', 'h1', 'h2', 'h3'].forEach(slot => {
          if (state.photos[`${t.id}_${slot}`]) count++;
        });
      });
      return count;
    }

    // =========================================================================
    // 3. 圖片自動壓縮（Canvas 最大寬 1000px、JPEG quality 0.80）與拖曳上傳
    // =========================================================================
    function compressImageFile(file) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type || !file.type.startsWith('image/')) {
          reject(new Error('請選擇圖片檔案（JPG / PNG / WebP）'));
          return;
        }
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('讀取圖片檔案失敗'));
        reader.onload = (e) => {
          const img = new Image();
          img.onerror = () => reject(new Error('無法解析此圖片格式'));
          img.onload = () => {
            try {
              const MAX_WIDTH = 1000;
              let width = img.naturalWidth || img.width;
              let height = img.naturalHeight || img.height;
              if (width > MAX_WIDTH) {
                height = Math.round(height * (MAX_WIDTH / width));
                width = MAX_WIDTH;
              }
              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              // 填入純白底色避免透明 PNG 轉 JPEG 時變黑底
              ctx.fillStyle = '#FFFFFF';
              ctx.fillRect(0, 0, width, height);
              ctx.drawImage(img, 0, 0, width, height);
              const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.80);
              resolve(compressedDataUrl);
            } catch (err) {
              reject(new Error('圖片壓縮失敗：' + err.message));
            }
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    /**
     * 處理單一插槽的圖片上傳
     */
    async function uploadPhotoToSlot(slotKey, file) {
      if (state.isClientMode || state.clientOnlyLocked) return;
      try {
        const dataUrl = await compressImageFile(file);
        const approxKB = Math.round((dataUrl.length * 3) / 4 / 1024);
        state.photos[slotKey] = dataUrl;
        persistPhotosToStorage();
        renderAll();
        showToast(`實景照上傳成功！（已自動壓縮至約 ${approxKB} KB 並暫存）`, '📷');
      } catch (err) {
        showToast(err.message || '圖片上傳失敗，請重試', '!');
      }
    }

    /**
     * 觸發隱藏檔案選擇器
     */
    function triggerSlotUpload(slotKey, event) {
      if (event) event.stopPropagation();
      if (state.isClientMode || state.clientOnlyLocked) return;
      state.pendingUploadKey = slotKey;
      const input = document.getElementById('global-photo-input');
      input.value = '';
      input.click();
    }

    /**
     * 清除單張已上傳照片
     */
    function clearSlotPhoto(slotKey, event) {
      if (event) event.stopPropagation();
      if (state.isClientMode || state.clientOnlyLocked) return;
      if (state.photos[slotKey]) {
        delete state.photos[slotKey];
        persistPhotosToStorage();
        renderAll();
        showToast('已清除並還原此景點插槽佔位圖', '↺');
      }

      event.stopPropagation();
      if (!event.currentTarget.contains(event.relatedTarget)) {

    }

      if (state.isClientMode || state.clientOnlyLocked) return;
      event.preventDefault();
      event.stopPropagation();
      event.currentTarget.classList.remove('drop-active');

    // =========================================================================
    function exportStandaloneHtml(clientOnly) {
      try {
        const clone = document.documentElement.cloneNode(true);

        // 清空 clone 中的動態渲染區，讓匯出後的 HTML 檔案打開時乾淨重新渲染
        const cloneApp = clone.querySelector('#app');
        if (cloneApp) cloneApp.innerHTML = '';
        const cloneModal = clone.querySelector('#modal-root');
        if (cloneModal) cloneModal.innerHTML = '';

        // 寫入所有已壓縮的實景照 Base64 與匯出模式設定到專屬 script 標籤
        const configScript = clone.querySelector('#embedded-photos-config');
        if (configScript) {
          const safePhotosJson = JSON.stringify(state.photos).replace(/</g, '\\u003c');
          const safeConfigJson = JSON.stringify({ clientOnly: Boolean(clientOnly) });
          configScript.textContent = `window.EMBEDDED_PHOTOS = ${safePhotosJson}; window.EXPORT_CONFIG = ${safeConfigJson};`;
        }

        const htmlString = '<!DOCTYPE html>\n' + clone.outerHTML;
        const blob = new Blob([htmlString], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);

        const filename = clientOnly
          ? '春節韓國精選6行程_客戶純淨版.html'
          : '春節韓國精選6行程_業務實景版.html';

        const a = document.createElement('a');
        a.href = url;

        closeModal();
        showToast(`已成功匯出「${filename}」（內含 ${uploadedCount} 張實景照，約 ${sizeMB} MB）`, '💾');

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatPrice(num) {
      return '$' + Number(num).toLocaleString('zh-TW');
    }

    /**
     * 計算距離 12/18 預購優惠截止剩餘天數
     */
    function getPromoCountdownText() {
      const now = new Date();
      let targetYear = now.getFullYear();
      let target = new Date(targetYear, 11, 18, 23, 59, 59); // 12 月為 11
      if (now > target) {
        target = new Date(targetYear + 1, 11, 18, 23, 59, 59);
      }
      const diffDays = Math.max(0, Math.ceil((target - now) / (1000 * 60 * 60 * 24)));
      return `⏳ 距 12/18 優惠截止倒數 ${diffDays} 天`;
    }

    /**
     * 安全複製文字至剪貼簿（優先使用 execCommand 相容 iFrame 環境）
     */
    function copyTextToClipboard(text, successMsg) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) {
          showToast(successMsg || '已複製至剪貼簿，可直接貼上 LINE 傳給客戶！', '📋');
          return;
        }
      } catch (e) {}

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
          .then(() => showToast(successMsg || '已複製至剪貼簿！', '📋'))
          .catch(() => showToast('複製失敗，請手動選取文案複製', '!'));
      } else {
        showToast('請手動選取文字框內容複製', '!');
      }
    }

    let toastTimer = null;
    function showToast(msg, icon = '✓') {
      const toast = document.getElementById('toast');
      const msgEl = document.getElementById('toast-msg');
      const iconEl = document.getElementById('toast-icon');
      if (!toast || !msgEl) return;
      msgEl.textContent = msg;
      iconEl.textContent = icon;
      toast.classList.remove('translate-x-full', 'opacity-0');
      toast.classList.add('translate-x-0', 'opacity-100');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('translate-x-full', 'opacity-0');
        toast.classList.remove('translate-x-0', 'opacity-100');
      }, 3400);
    }

        <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-8 min-h-[70vh]">
          ${bodyHtml}
        </main>
        ${renderFooterAndBottomBar()}
      `;

      renderModals();
    }

    // 啟動初始化
    window.addEventListener('DOMContentLoaded', () => {
      loadPhotosAndConfig();
      renderAll();
    });
  </script>
</body>
</html>
